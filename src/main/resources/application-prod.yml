server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: STRICT

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:cust_portal_db}
    username: ${DB_USER:cust_admin}
    password: ${DB_PASSWORD:CustEnterpriseSecure2026!}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  h2:
    console:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
